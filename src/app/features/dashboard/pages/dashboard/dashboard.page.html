<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Domus</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/notifications">
        <ion-icon name="notifications-outline" slot="icon-only"></ion-icon>
        <ion-badge color="danger" *ngIf="notificationsApiService.unreadCount() > 0">
          {{ notificationsApiService.unreadCount() }}
        </ion-badge>
      </ion-button>
      <ion-button (click)="logout()">Cerrar sesion</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="dashboard-page">
  <section class="hero" *ngIf="user as currentUser">
    <p class="eyebrow">Panel personal</p>
    <h1>Hola, {{ currentUser.firstName }} {{ currentUser.lastName }}</h1>
    <p class="copy">
      Accede sólo a las herramientas habilitadas para tu perfil y comunidad.
    </p>

    <div class="role-row">
      <ion-chip color="primary" *ngFor="let role of currentUser.roles">
        <ion-label>{{ role }}</ion-label>
      </ion-chip>
    </div>
  </section>

  <ion-grid fixed>
    <ion-row>
      <ion-col size="12" sizeMd="6" *ngFor="let action of quickActions">
        <ion-card *ngIf="canShowAction(action)">
          <ion-card-header>
            <ion-card-title>{{ action.title }}</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            {{ action.description }}
            <ion-button
              *ngIf="action.route"
              fill="outline"
              size="small"
              class="action-link"
              [routerLink]="action.route">
              Abrir
            </ion-button>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
