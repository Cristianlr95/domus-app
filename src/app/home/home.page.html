<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Domus</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="home-page">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Domus</ion-title>
    </ion-toolbar>
  </ion-header>

  <section class="hero">
    <p class="eyebrow">Base inicial</p>
    <h1>Frontend Ionic + Angular listo para empezar.</h1>
    <p class="copy">
      Este repositorio replica la base tecnológica de Atleta para que Domus pueda comenzar con una estructura moderna,
      móvil y web desde el primer commit.
    </p>

    <ion-list inset="true">
      <ion-item>
        <ion-label>Ionic 8 + Angular 20</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Capacitor 8</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Playwright y Karma configurados</ion-label>
      </ion-item>
    </ion-list>
  </section>
</ion-content>
