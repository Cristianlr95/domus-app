<ion-app>
  <ng-container *ngIf="authService.currentUser() as currentUser; else publicOutlet">
    <ion-split-pane contentId="domus-main" when="lg" class="domus-shell">
      <ion-menu contentId="domus-main" type="overlay" class="domus-menu">
        <ion-content>
          <section class="brand">
            <div class="brand-lockup" aria-label="Domus">
              <img src="assets/brand/domus-logo-primary.png" alt="Domus">
            </div>
            <div class="profile-copy">
              <strong>{{ currentUser.firstName }} {{ currentUser.lastName }}</strong>
              <small>{{ roleLabel(currentUser.roles) }}</small>
            </div>
          </section>

          <ion-list lines="none" class="nav-list">
            <ng-container *ngFor="let group of navGroups">
              <ng-container *ngIf="visibleItemsForGroup(group.key) as groupItems">
                <p class="nav-heading" *ngIf="groupItems.length">{{ group.label }}</p>
                <ion-item
                  button
                  detail="false"
                  *ngFor="let item of groupItems"
                  [routerLink]="item.route"
                  routerDirection="root"
                  [class.active]="isActive(item.route)">
                  <ion-icon [name]="item.icon" slot="start"></ion-icon>
                  <ion-label>{{ item.label }}</ion-label>
                  <ion-badge
                    *ngIf="item.route === '/notifications' && notificationsApiService.unreadCount() > 0"
                    color="danger"
                    slot="end">
                    {{ notificationsApiService.unreadCount() }}
                  </ion-badge>
                </ion-item>
              </ng-container>
            </ng-container>
            <ion-item button detail="false" class="logout-item" (click)="logout()">
              <ion-icon name="log-out-outline" slot="start"></ion-icon>
              <ion-label>Cerrar sesion</ion-label>
            </ion-item>
          </ion-list>
        </ion-content>

      </ion-menu>

      <main id="domus-main" class="shell-main">
        <ion-router-outlet></ion-router-outlet>

        <nav class="mobile-nav" aria-label="Navegacion principal">
          <a
            *ngFor="let item of visibleMobileNavItems"
            [routerLink]="item.route"
            [class.active]="isActive(item.route)">
            <ion-icon [name]="item.icon"></ion-icon>
            <span>{{ item.mobileLabel ?? item.label }}</span>
            <ion-badge
              *ngIf="item.route === '/notifications' && notificationsApiService.unreadCount() > 0"
              color="danger">
              {{ notificationsApiService.unreadCount() }}
            </ion-badge>
          </a>
          <button
            *ngIf="hasMoreNavigation"
            type="button"
            class="more-button"
            aria-label="Abrir menu completo"
            (click)="openMenu()">
            <ion-icon name="menu-outline"></ion-icon>
            <span>Mas</span>
          </button>
        </nav>
      </main>
    </ion-split-pane>
  </ng-container>

  <ng-template #publicOutlet>
    <ion-router-outlet></ion-router-outlet>
  </ng-template>
</ion-app>
